name: Build ModelConvert

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release New version"
        required: false
        type: string
        default: ""

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch_name: windows-x64
          - label: Windows ARM
            os: windows-11-arm
            arch_name: windows-arm64
          - label: macOS Intel
            os: macos-15-intel
            arch_name: macos-x64
          - label: macOS ARM
            os: macos-latest
            arch_name: macos-arm64
          - label: Linux x64
            os: ubuntu-latest
            arch_name: linux-x64
          - label: Linux ARM
            os: ubuntu-24.04-arm
            arch_name: linux-arm64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller main.spec --noconfirm

      # 把 READMETXT/ 下的多语言说明 txt 放进产物根目录：
      # Windows / Linux → dist/ModelConvert/（与 exe 同级）；
      # macOS → .app 旁边（不写进 .app 内部，避免破坏其临时签名）。
      - name: Bundle README txt files
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp READMETXT/*.txt dist/
          else
            cp READMETXT/*.txt dist/ModelConvert/
          fi

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive `
            -Path dist/ModelConvert `
            -DestinationPath "ModelConvert-${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch_name }}.zip"

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r "../ModelConvert-${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch_name }}.zip" ModelConvert

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../ModelConvert-${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch_name }}.zip" ModelConvert.app *.txt

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ModelConvert-${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch_name }}
          path: ModelConvert-${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch_name }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build

    if: >
      github.ref_type == 'tag' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.release_tag != ''
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      # ========================================
      # 正常 Tag 发布
      # ========================================
      - name: Create or update Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*.zip

          # 第一次创建时保持 Draft
          # 发布前可以到 GitHub Release 页面检查
          draft: true

          generate_release_notes: true

          prerelease: false

          # 明确指定：同名文件覆盖
          overwrite_files: true

      # ========================================
      # 手动更新已有 Release
      # ========================================
      - name: Update existing Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ inputs.release_tag }}" \
            release-artifacts/*.zip \
            --clobber