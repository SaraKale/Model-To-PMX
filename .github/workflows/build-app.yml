name: Build ModelConvert

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch_name: windows-x64
          - label: Windows ARM
            os: windows-11-arm
            arch_name: windows-arm64
          - label: macOS Intel
            os: macos-15-intel
            arch_name: macos-x64
          - label: macOS ARM
            os: macos-latest
            arch_name: macos-arm64
          - label: Linux x64
            os: ubuntu-latest
            arch_name: linux-x64
          - label: Linux ARM
            os: ubuntu-24.04-arm
            arch_name: linux-arm64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller main.spec --noconfirm

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/ModelConvert -DestinationPath ModelConvert-${{ matrix.arch_name }}.zip

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist && zip -r ../ModelConvert-${{ matrix.arch_name }}.zip ModelConvert

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r -y ../ModelConvert-${{ matrix.arch_name }}.zip ModelConvert.app

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ModelConvert-${{ matrix.arch_name }}
          path: ModelConvert-${{ matrix.arch_name }}.zip
          if-no-files-found: error
